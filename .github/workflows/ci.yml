name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One finite Bazel action, declared in .github/lanes.json and submitted by the
# immutable ci-templates v4 edge. This caller selects no runner, provider,
# endpoint, credential, or execution pool; the adopting organization supplies
# the generic gf-v4-dispatch edge. There is no hosted lane and no fallback:
# every gate this repo enforces is a registered target under
# //:ci_validation_suite.
jobs:
  check:
    uses: xoxd-ai/ci-templates/.github/workflows/spoke-ci-v4.yml@ae836d8400d5784d74af4fecc020f225d1c2d08e # v5.1.1
    with:
      action_name: check
